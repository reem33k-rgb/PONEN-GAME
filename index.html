<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=540, F=320, ZFAR=2800, ROAD=230, LANE=153;
let H=960, HZ=326, GR=860, scale=1;
const FONT='Heebo,"Segoe UI",Arial,sans-serif';
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function resize(){
  const vw=innerWidth, vh=innerHeight, asp=vw/vh;
  H=asp<W/960?Math.min(1240,Math.round(W/asp)):960;
  HZ=Math.round(H*.34); GR=Math.round(H*.895);
  const sc=Math.min(vw/W,vh/H), dpr=Math.min(3,devicePixelRatio||1);
  cv.style.width=W*sc+'px'; cv.style.height=H*sc+'px';
  cv.width=Math.round(W*sc*dpr); cv.height=Math.round(H*sc*dpr);
  scale=sc*dpr;
}
addEventListener('resize',resize); resize();

// ---------- sound / haptics ----------
let ac=null;
function beep(f,d,type='triangle',vol=.06,slide=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,ac.currentTime+d);
    g.gain.value=vol;g.gain.linearRampToValueAtTime(0,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const sMove=()=>beep(420,.07,'sine',.04,160);
const sCoffee=()=>{beep(880,.08,'triangle',.07);setTimeout(()=>beep(1320,.12,'triangle',.07),70)};
const sHit=()=>{beep(140,.3,'sawtooth',.09,-90);vib(90)};
const sShot=()=>{beep(1800,.04,'square',.05);setTimeout(()=>beep(900,.08,'square',.05),70);vib(30)};
const sOver=()=>beep(300,.55,'sawtooth',.07,-230);

// ---------- state ----------
let state='start', last=0, acc=0, G, best=0, btns=[];
try{best=+localStorage.getItem('vn_best2')||0}catch(e){}
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

function reset(){
  G={t:0,speed:10,dist:0,bonus:0,score:0,anger:0,lane:0,laneF:0,vel:0,
     inv:0,shake:0,pop:0,hurt:0,flash:0,red:0,
     items:[],parts:[],bubbles:[],pol:null,
     sinceRow:0,rowGap:60,sinceCam:0,sinceSilly:0,sinceTree:0,coffees:0,shots:0,sillies:0,silly:0,nextTalk:420,overT:0};
  for(let z=260;z<ZFAR;z+=230)spawnTrees(z);
  if(state==='play'){
    for(const z of[1500,2150]){
      const free=pick([-1,0,1]);
      for(let i=0;i<3;i++)G.items.push({k:'roll',lane:free,z:z+i*95,size:74});
      const o=pick(OBS.slice(0,6)),l=pick([-1,0,1].filter(x=>x!==free));
      G.items.push({k:'obs',lane:l,z,e:o.e,size:o.size,n:o.n});
    }
  }
}
function spawnTrees(z){
  G.items.push({k:'tree',e:pick(['🌴','🌳','🌴']),lx:-rand(310,430),z,size:230});
  G.items.push({k:'tree',e:pick(['🌴','🌳','🌴']),lx:rand(310,430),z:z+110,size:230});
}
reset();

// ---------- talk ----------
const T={
 hit:[['she','!תרנגולת!!'],['she','!עיניים על הכביש'],['she','?!ברצינות'],['she','!אני יורדת בתחנה הבאה'],['he','!זה לא אני, זה הכביש']],
 roll:[['he','!ספרינג רולס! כן'],['she','!גם לי'],['he','!דלק לנהג'],['she','!עוד אחד, עוד אחד']],
 hotel:[['she','!מצאנו מלון! עם בריכה'],['she','!כולל ארוחת בוקר'],['he','!חמש כוכבים. סומכים עליי']],
 silly:[['he','!בלבלבלבל'],['she','!אני פינגווין'],['he','!בואי נעשה פרצופים'],['she','!הנה אני בלי ג׳ינס']],
 idle:[['she','?עוד כמה קילומטר'],['she','!אני רעבה'],['he','!תחזיקי חזק'],['she','!אל תיסע מהר כל כך']],
};
function say(k){const [who,text]=pick(T[k]);G.bubbles=G.bubbles.filter(b=>b.who!==who);G.bubbles.push({who,text,t:120})}

// ---------- input ----------
function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function go(d){
  if(state!=='play')return;
  const n=Math.max(-1,Math.min(1,G.lane+d));
  if(n!==G.lane){G.lane=n;sMove()}
}
function begin(){state='play';reset();beep(520,.1)}
let ptr=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr={x:e.clientX,y:e.clientY,sx:e.clientX,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(!ptr||state!=='play')return;
  const dx=e.clientX-ptr.sx;
  if(Math.abs(dx)>26){go(dx>0?1:-1);ptr.sx=e.clientX;ptr.moved=true}
});
cv.addEventListener('pointerup',e=>{
  e.preventDefault();if(!ptr)return;const p=ptr;ptr=null;
  if(state==='play'){
    if(!p.moved){const [x]=toLogical(e);go(x<W/2?-1:1)}
    return;
  }
  const [x,y]=toLogical(e);
  for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.id==='share')return share();}}
  if(state==='start')begin();
  else if(state==='over'&&G.overT>45)begin();
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();go(-1)}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();go(1)}
  else if(['Space','Enter'].includes(e.code)){e.preventDefault();if(state==='start')begin();else if(state==='over'&&G.overT>45)begin()}
});
function share(){
  const text=`עשיתי ${G.score} נקודות ב״פוננן הבן והבת״ 🏍️ תנסו לנצח אותי!`;
  const url=location.href;
  if(navigator.share){navigator.share({title:'פוננן הבן והבת',text,url}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(text+' '+url).catch(()=>{})}
}

// ---------- spawning ----------
const OBS=[
  {e:'🐔',size:92,n:'chicken'},{e:'🐔',size:92,n:'chicken'},
  {e:'🐃',size:170,n:'buffalo'},{e:'🛺',size:165,n:'tuk'},
  {e:'🚧',size:125,n:'barrier'},{e:'🪨',size:100,n:'rock'},{e:'',size:0,n:'hole'},
];
function spawnRow(){
  const lanes=[-1,0,1];
  let free=pick(lanes), cam=false;
  G.sinceCam+=1;
  G.sinceSilly+=1;
  if(G.sinceCam>=9){cam=true;G.sinceCam=0}
  const z=ZFAR;
  if(cam){
    G.items.push({k:'hotel',lane:free,z,size:118});
  }else if(G.sinceSilly>=5){
    G.sinceSilly=0;G.items.push({k:'silly',lane:free,z,size:96});
  }else if(Math.random()<.8){
    for(let i=0;i<3;i++)G.items.push({k:'roll',lane:free,z:z+i*95,size:74});
  }
  const others=lanes.filter(l=>l!==free);
  const two=G.t>60*18&&Math.random()<.45;
  const pickedOthers=two?others:[pick(others)];
  for(const l of pickedOthers){const o=pick(OBS);G.items.push({k:'obs',lane:l,z,e:o.e,size:o.size,n:o.n})}
}

// ---------- update ----------
function step(){
  G.t++;
  if(state==='start'){G.dist+=10;G.vel=0;return}
  if(state==='over'){G.overT++;G.dist+=Math.max(0,3-G.overT*.05);return}
  const sp=G.speed=Math.min(22,10+G.t/60*.14);
  G.dist+=sp;
  const d=G.lane-G.laneF;G.laneF+=d*.2;G.vel=d*.2;
  if(G.inv>0)G.inv--;if(G.shake>0)G.shake--;if(G.pop>0)G.pop--;if(G.hurt>0)G.hurt--;
  if(G.flash>0)G.flash=Math.max(0,G.flash-.05);if(G.red>0)G.red=Math.max(0,G.red-.04);
  G.anger=Math.max(0,G.anger-2.2/60);
  if(G.silly>0){G.silly--;if(G.t%3===0)burst(W/2+G.laneF*LANE+rand(-60,60),GR-300,['#ff5a5f','#ffd166','#43d17a','#46b6ff','#c77dff'],2)}

  G.sinceRow+=1;
  if(G.sinceRow>=G.rowGap){G.sinceRow=0;G.rowGap=Math.max(34,64-G.t/60*.35);spawnRow()}
  G.sinceTree+=sp;if(G.sinceTree>230){G.sinceTree=0;spawnTrees(ZFAR)}

  for(const it of G.items){
    it.z-=sp;
    if(it.k==='tree'||it.done)continue;
    if(Math.abs(it.z)<46&&Math.abs(it.lane-G.laneF)<.62){
      if(it.k==='obs'&&G.inv===0){
        it.done=true;G.anger=Math.min(100,G.anger+34);G.inv=75;G.shake=20;G.hurt=22;G.red=1;sHit();say('hit');
        burst(W/2+G.laneF*LANE,GR-90,['#ffd166','#ff6b6b','#fff'],14);
      }else if(it.k==='roll'){
        it.done=true;G.coffees++;G.bonus+=10;G.anger=Math.max(0,G.anger-12);G.pop=18;sCoffee();
        burst(W/2+G.laneF*LANE,GR-110,['#ffd166','#fff7c2','#e0a030'],10);
        if(G.coffees%4===0)say('roll');
      }else if(it.k==='hotel'){
        it.done=true;G.shots++;G.bonus+=50;G.anger=Math.max(0,G.anger-30);G.pop=50;G.flash=.8;sShot();say('hotel');
        G.pol={t:0,n:G.shots,cap:pick(['מצאנו מלון!','חדר עם נוף','כולל ארוחת בוקר','בריכה על הגג'])};
      }else if(it.k==='silly'){
        it.done=true;G.sillies++;G.bonus+=30;G.anger=Math.max(0,G.anger-15);G.silly=170;G.pop=20;sCoffee();vib(40);say('silly');
      }
    }
  }
  G.items=G.items.filter(it=>it.z>-120&&!it.done);
  for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.pol){G.pol.t++;if(G.pol.t>130)G.pol=null}
  for(const b of G.bubbles)b.t--;G.bubbles=G.bubbles.filter(b=>b.t>0);
  if(--G.nextTalk<=0){G.nextTalk=rand(420,720);if(!G.bubbles.length)say('idle')}
  G.score=Math.floor(G.dist/60)+G.bonus;
  if(G.anger>=100){
    state='over';G.overT=0;sOver();
    if(G.score>best){best=G.score;try{localStorage.setItem('vn_best2',best)}catch(e){}}
  }
}
function burst(x,y,cols,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:rand(-5,5),vy:rand(-9,-2),life:rand(20,36),c:pick(cols),r:rand(3,7)})}

// ---------- drawing: world ----------
const sc=z=>F/(F+z), Y=s=>HZ+(GR-HZ)*s;
function glass(x,y,w,h,r){
  ctx.fillStyle='rgba(12,32,58,.5)';ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();
}
function sky(){
  let g=ctx.createLinearGradient(0,0,0,HZ);
  g.addColorStop(0,'#46b6ff');g.addColorStop(.6,'#9bdcff');g.addColorStop(1,'#fff0c9');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HZ+2);
  const sg=ctx.createRadialGradient(W*.72,HZ-30,5,W*.72,HZ-30,190);
  sg.addColorStop(0,'rgba(255,244,190,.95)');sg.addColorStop(1,'rgba(255,244,190,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,HZ+2);
  // clouds
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<4;i++){
    const x=((i*230-G.dist*.03)%900+900)%900-180,y=50+i*38%120;
    ctx.beginPath();ctx.ellipse(x,y,70,18,0,0,7);ctx.ellipse(x+34,y-14,40,20,0,0,7);ctx.ellipse(x-30,y-8,34,16,0,0,7);ctx.fill();
  }
  // mountains
  const off=G.laneF*14;
  const layer=(base,amp,wl,col)=>{
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,HZ+2);
    for(let x=0;x<=W;x+=10){const t=x+off*(base/HZ);ctx.lineTo(x,base+Math.sin(t/wl)*amp+Math.sin(t/(wl*.43)+2)*amp*.4)}
    ctx.lineTo(W,HZ+2);ctx.closePath();ctx.fill();
  };
  layer(HZ-95,34,120,'#8fb7d6');layer(HZ-55,26,90,'#6aa08f');layer(HZ-22,14,60,'#4f9a5f');
}
function ground(){
  // sides (rice terraces)
  const band=150, base=Math.floor(G.dist/band), o=G.dist%band;
  ctx.fillStyle='#74c04a';ctx.fillRect(0,HZ,W,H-HZ);
  for(let i=-1;i<Math.ceil(ZFAR/band);i++){
    const z0=i*band-o, z1=z0+band;
    const y0=Y(sc(Math.max(z0,-200))), y1=Y(sc(z1));
    const idx=i+base;
    ctx.fillStyle=idx%2?'#6bb743':'#82cc55';
    ctx.fillRect(0,y1,W,y0-y1+1);
    // terrace lines
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,y1,W,Math.max(1,(y0-y1)*.12));
  }
  // haze at horizon
  const hg=ctx.createLinearGradient(0,HZ,0,HZ+110);hg.addColorStop(0,'rgba(255,240,200,.85)');hg.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,HZ,W,110);
  // road
  const sb=(H-HZ)/(GR-HZ), half=ROAD*sb;
  let rg=ctx.createLinearGradient(0,HZ,0,H);rg.addColorStop(0,'#8a8f9c');rg.addColorStop(.35,'#555a69');rg.addColorStop(1,'#303443');
  ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(W/2,HZ);ctx.lineTo(W/2+half,H);ctx.lineTo(W/2-half,H);ctx.closePath();ctx.fill();
  // edge lines
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;
  for(const m of[-1,1]){ctx.beginPath();ctx.moveTo(W/2,HZ);ctx.lineTo(W/2+m*(half-6),H);ctx.stroke()}
  // dashes
  const dl=120;
  ctx.fillStyle='rgba(255,226,120,.95)';
  for(let i=-1;i<Math.ceil(ZFAR/dl/2);i++){
    const z0=i*2*dl-(G.dist%(2*dl)), z1=z0+dl;
    if(z1<-150)continue;
    const s0=sc(Math.max(z0,-150)), s1=sc(z1), y0=Y(s0), y1=Y(s1);
    for(const m of[-.5,.5]){
      const w0=5*s0*1.2,w1=5*s1*1.2,x0=W/2+m*LANE*s0,x1=W/2+m*LANE*s1;
      ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x1+w1,y1);ctx.lineTo(x0+w0,y0);ctx.lineTo(x0-w0,y0);ctx.fill();
    }
  }
}
function emoji(e,x,y,size,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#000';ctx.shadowColor='transparent';ctx.font=`${size}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(e,x,y);ctx.restore();
}
function springRoll(x,y,s,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(-.5+Math.sin(rot)*.15);
  const L=s*.55,r=s*.2;
  const g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#ffd36b');g.addColorStop(.5,'#e8962a');g.addColorStop(1,'#b8631a');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-L,-r,2*L,2*r,r*.9);ctx.fill();
  ctx.fillStyle='rgba(255,236,170,.9)';
  for(const m of[-1,1]){ctx.beginPath();ctx.ellipse(m*L*.98,0,r*.32,r*.78,0,0,7);ctx.fill();ctx.fillStyle='#5aa33a';ctx.beginPath();ctx.arc(m*L*1.02,-r*.2,r*.28,0,7);ctx.fill();ctx.fillStyle='rgba(255,236,170,.9)'}
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.roundRect(-L*.8,-r*.7,L*1.4,r*.3,r*.15);ctx.fill();
  ctx.fillStyle='rgba(120,60,10,.35)';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*L*.32,r*.35,r*.12,0,7);ctx.fill()}
  ctx.restore();
}
function palm(x,y,h,dir,seed){
  const sway=Math.sin(G.t*.03+seed*.01)*h*.02, top=y-h*.95;
  ctx.strokeStyle='#8a5a34';ctx.lineWidth=Math.max(2,h*.07);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+dir*h*-.12,y-h*.5,x+sway,top);ctx.stroke();
  const cols=['#2e8b3d','#3aa64b','#277a36'];
  for(let i=0;i<7;i++){
    const a=-Math.PI/2+(i-3)*.52+sway*.01;
    ctx.save();ctx.translate(x+sway,top);ctx.rotate(a);
    ctx.fillStyle=cols[i%3];ctx.beginPath();
    ctx.moveTo(0,0);ctx.quadraticCurveTo(h*.12,-h*.1,h*.04,-h*.34);ctx.quadraticCurveTo(-h*.1,-h*.14,0,0);ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#6b4a2b';ctx.beginPath();ctx.arc(x+sway,top+h*.03,h*.035,0,7);ctx.fill();
}
function drawItem(it){
  const s=sc(it.z);if(s<.1)return;
  const lx=it.lane!==undefined?it.lane*LANE:it.lx;
  const x=W/2+lx*s, y=Y(s), size=it.size*s;
  const al=it.z>ZFAR-350?Math.max(0,(ZFAR-it.z)/350):1;
  ctx.globalAlpha=al;
  if(it.k==='tree'){
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y,size*.28,size*.05,0,0,7);ctx.fill();
    palm(x,y,size,lx<0?-1:1,it.z);ctx.globalAlpha=1;return;
  }
  if(it.n==='hole'){
    ctx.fillStyle='#1d1e26';ctx.beginPath();ctx.ellipse(x,y,70*s,16*s,0,0,7);ctx.fill();
    ctx.fillStyle='#34363f';ctx.beginPath();ctx.ellipse(x,y-2*s,58*s,10*s,0,0,7);ctx.fill();ctx.globalAlpha=1;return;
  }
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,size*.42,size*.09,0,0,7);ctx.fill();
  if(it.k==='roll'){
    const bob=Math.sin(G.t*.12+it.z*.01)*6*s;
    ctx.fillStyle='rgba(255,220,120,.35)';ctx.beginPath();ctx.arc(x,y-48*s+bob,44*s,0,7);ctx.fill();

  ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=16;ctx.shadowOffsetY=6;ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.fillStyle='#fff';ctx.font=`900 ${h*.42}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(label,x+w/2,y+h/2+2);
}
function title(txt,y,size,col,stroke){
  ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
  ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=size*.16;ctx.strokeText(txt,W/2,y);ctx.fillStyle=col;ctx.fillText(txt,W/2,y);
}
function drawStart(){
  ctx.direction='rtl';sky();ground();
  ctx.fillStyle='rgba(10,30,50,.28)';ctx.fillRect(0,0,W,H);
  title('פוננן',H*.13,104,'#fff','#0e4a8a');
  title('הבן והבת',H*.13+92,76,'#ffd166','#0e4a8a');
  const bob=Math.sin(G.t*.05)*5;
  group(W/2,H*.8+bob,.78,Math.sin(G.t*.03)*.05,G.t);
  ctx.fillStyle='rgba(255,255,255,.96)';ctx.font=`800 21px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('החליקו ימינה ושמאלה בין הנתיבים',W/2,H*.33);
  ctx.font=`500 18px ${FONT}`;ctx.fillText('אספו ספרינג רולס  ·  חפשו מלונות 🏨  ·  תעשו שטויות 🤪',W/2,H*.33+34);
  const a=.5+.5*Math.sin(G.t*.08);ctx.globalAlpha=.4+a*.6;ctx.font=`900 40px ${FONT}`;
  ctx.fillText('‹',W/2-120,H*.33+84);ctx.fillText('›',W/2+120,H*.33+84);ctx.globalAlpha=1;
  const bw=300,bh=72,bx=W/2-bw/2,by=H*.8-440*1.12*.0+ (H*.93-H*.8)-4;
  btns=[];
  pill(bx,H-bh-36,bw,bh,'!בואו נתחיל','#ffb03a','#ff6f3c');
  if(best>0){ctx.fillStyle='#fff';ctx.font=`800 17px ${FONT}`;ctx.fillText('השיא שלכם: '+best,W/2,H-bh-60)}
}
function drawOver(){
  scene();hud();
  ctx.fillStyle='rgba(20,8,12,.62)';ctx.fillRect(0,0,W,H);
  ctx.direction='rtl';
  const f=Math.min(1,G.overT/12);
  ctx.save();ctx.translate(W/2,H*.2);ctx.rotate(Math.sin(G.t*.35)*.05*f);
  face('she',0,0,72,'mad');ctx.restore();
  emoji('💢',W/2+100,H*.13,54);emoji('💢',W/2-120,H*.19,42);
  title('היא ירדה',H*.5,60,'#fff','#7a1020');
  title('!מהאופנוע',H*.5+64,60,'#fff','#7a1020');
  glass(W/2-170,H*.5+112,340,130,28);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`500 18px ${FONT}`;ctx.fillText('הניקוד שלכם',W/2,H*.5+138);
  ctx.font=`900 52px ${FONT}`;ctx.fillText(G.score,W/2,H*.5+182);
  ctx.font=`800 14px ${FONT}`;ctx.fillStyle='#ffd9d9';ctx.fillText(`שיא: ${best}   ·   ספרינג רולס ${G.coffees}   ·   מלונות ${G.shots}   ·   שטויות ${G.sillies}`,W/2,H*.5+222);
  btns=[];
  if(G.overT>45){
    pill(W/2-150,H-190,300,68,'!עוד סיבוב','#ffb03a','#ff6f3c');
    pill(W/2-110,H-106,220,54,'שתפו את התוצאה','rgba(255,255,255,.28)','rgba(255,255,255,.18)');
    btns.push({id:'share',x:W/2-110,y:H-106,w:220,h:54});
  }
}
function drawPlay(){
  scene();hud();
  for(const b of G.bubbles)bubble(b.who,b.text,b.t);
  if(G.red>0){const g=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.7);g.addColorStop(0,'rgba(255,40,40,0)');g.addColorStop(1,`rgba(255,40,40,${G.red*.55})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${G.flash})`;ctx.fillRect(0,0,W,H)}
  polaroid();
}

function frame(ts){
  if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;
  while(acc>=1000/60){step();acc-=1000/60}
  ctx.setTransform(scale,0,0,scale,0,0);ctx.direction='rtl';
  btns=state==='play'?[]:btns;
  if(state==='start')drawStart();else if(state==='over')drawOver();else drawPlay();
  requestAnimationFrame(frame);
}
(document.fonts&&document.fonts.load?document.fonts.load('900 20px Heebo').catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
