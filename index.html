const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=960,H=540,GY=470,PX=230;
ctx.direction='rtl';

// ---------- images ----------
const imgHe=new Image(), imgShe=new Image();
let loaded=0; const onl=()=>{loaded++};
imgHe.onload=imgShe.onload=onl; imgHe.src=FACE_HE; imgShe.src=FACE_SHE;
const SRC={he:[0,12,240,240],she:[0,20,180,180]};

// ---------- sound ----------
let ac=null;
function beep(f,d,type='square',vol=.06,slide=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,ac.currentTime+d);
    g.gain.value=vol;g.gain.linearRampToValueAtTime(0,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
const sJump=()=>beep(330,.18,'square',.05,300);
const sCoffee=()=>{beep(880,.08,'triangle',.08);setTimeout(()=>beep(1320,.12,'triangle',.08),70)};
const sHit=()=>beep(120,.3,'sawtooth',.1,-80);
const sShot=()=>{beep(1800,.04,'square',.06);setTimeout(()=>beep(900,.07,'square',.06),60)};
const sOver=()=>{beep(300,.5,'sawtooth',.08,-220)};

// ---------- state ----------
let state='start', last=0, acc=0;
let G;
let best=0; try{best=+localStorage.getItem('vn_best')||0}catch(e){}

function reset(){
  G={t:0,speed:6.5,dist:0,score:0,bonus:0,anger:0,
     y:0,vy:0,onGround:true,inv:0,shake:0,pop:0,
     obs:[],cof:[],spots:[],bubbles:[],pol:null,flash:0,
     sinceObs:0,gapObs:500,sinceSpot:-1500,selfies:0,coffees:0,
     nextTalk:300,wheel:0,hitFlash:0};
}
reset();

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- talk ----------
const T={
 hit:[['she','!תיזהר!! תרנגולת'],['she','!אני מורידה אותך בתחנה הבאה'],['she','!!עיניים על הכביש'],['she','אמרתי לך לקחת ווייז'],['he','!זה לא אני, זה הכביש'],['she','!איך אפשר לפספס תאו מים']],
 cof:[['he','!קפה וייטנאמי. חייב'],['she','!גם לי גם לי'],['he','!דלק לנהג']],
 shot:[['she','!יצאנו מהממים'],['she','!הולך לאינסטגרם'],['he','!תגידי שאני נראה גבוה']],
 miss:[['she','?!פספסת את התמונה ברצינות'],['she','!עברנו את הנוף. תודה רבה']],
 idle:[['she','?עוד כמה קילומטר'],['she','!אני רעבה'],['he','!הברכיים האלה מחזיקות הכל'],['he','!תחזיקי חזק'],['she','!אל תיסע מהר כל כך']],
};
function say(k){const [who,text]=pick(T[k]);G.bubbles=G.bubbles.filter(b=>b.who!==who);G.bubbles.push({who,text,t:130});}

// ---------- input ----------
function jump(){
  if(state==='start'){return startGame()}
  if(state==='over'){ if(G.overT>40) startGame(); return }
  if(G.onGround){G.vy=-17.2;G.onGround=false;sJump();}
}
function selfie(){
  if(state!=='play')return;
  for(const s of G.spots){
    if(!s.done&&!s.missed&&PX>=s.x&&PX<=s.x+s.w){
      s.done=true;G.selfies++;G.bonus+=50;G.anger=Math.max(0,G.anger-30);
      G.flash=1;G.pop=40;sShot();
      G.pol={t:0,n:G.selfies,cap:pick(['וייטנאם ✌','סלפי עם נוף','אנחנו פה!','הזוג המאושר'])};
      say('shot');return;
    }
  }
}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}
  else if(['KeyS','KeyX','ArrowDown','Enter'].includes(e.code)){e.preventDefault();if(state==='play')selfie();else jump()}
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
const bj=document.getElementById('jump'), bs=document.getElementById('selfie');
bj.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();jump()});
bs.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();selfie()});

function startGame(){reset();state='play';G.overT=0;beep(520,.1,'triangle');}

// ---------- spawning ----------
const OB={
  chicken:{e:'🐔',s:52,w:34,h:42,dy:6},
  hens:{e:'🐔🐔🐔',s:44,w:100,h:38,dy:6},
  buffalo:{e:'🐃',s:118,w:92,h:78,dy:14},
  tuk:{e:'🛺',s:104,w:92,h:76,dy:8},
  hole:{e:'',s:0,w:96,h:10,dy:0},
};
function spawnObs(){
  const keys=['chicken','chicken','hens','buffalo','tuk','hole'];
  const type=pick(keys), d=OB[type];
  const o={type,x:W+80,w:d.w,h:d.h};
  G.obs.push(o);
  if(Math.random()<.65){G.cof.push({x:o.x+d.w/2,y:GY-rand(150,175),r:20,got:false});}
  G.gapObs=G.speed*rand(46,72)+d.w;
}
function spawnCoffeeLine(){
  const y=Math.random()<.5?GY-60:GY-150, x=W+60;
  for(let i=0;i<4;i++)G.cof.push({x:x+i*50,y:y-(i%2?10:0),r:20,got:false});
}
function spawnSpot(){G.spots.push({x:W+40,w:380,done:false,missed:false});}

// ---------- update ----------
function step(){
  if(state==='start'){G.wheel+=6;G.dist+=3;G.t++;return}
  if(state==='over'){G.overT++;G.t++;return}
  G.t++;
  G.speed=Math.min(13.5,6.5+G.t/60*0.11);
  const sp=G.speed;
  G.dist+=sp;G.wheel+=sp;

  // player
  if(!G.onGround){G.vy+=.78;G.y+=G.vy;if(G.y>=0){G.y=0;G.vy=0;G.onGround=true}}
  if(G.inv>0)G.inv--;
  if(G.shake>0)G.shake--;
  if(G.pop>0)G.pop--;
  if(G.flash>0)G.flash=Math.max(0,G.flash-.06);
  if(G.hitFlash>0)G.hitFlash--;

  // spawn
  G.sinceObs+=sp;if(G.sinceObs>G.gapObs){G.sinceObs=0;spawnObs()}
  G.sinceSpot+=sp;if(G.sinceSpot>4200){G.sinceSpot=0;spawnSpot()}
  if(Math.random()<.004&&G.obs.length<2)spawnCoffeeLine();

  // hitbox
  const px1=PX-44,px2=PX+58,py2=GY+G.y-2,py1=GY+G.y-70;

  for(const o of G.obs){
    o.x-=sp;
    if(G.inv>0||o.hit)continue;
    const ox1=o.x+6,ox2=o.x+o.w-6,oy2=GY,oy1=GY-o.h+6;
    if(px2>ox1&&px1<ox2&&py2>oy1&&py1<oy2){
      o.hit=true;G.anger=Math.min(100,G.anger+25);G.inv=80;G.shake=22;G.hitFlash=14;
      G.speed=Math.max(6.5,G.speed-1.5);sHit();say('hit');
    }
  }
  G.obs=G.obs.filter(o=>o.x>-200&&!(o.hit&&o.type!=='hole'&&o.x<PX-100));

  for(const c of G.cof){
    c.x-=sp;
    if(c.got)continue;
    if(Math.abs(c.x-PX-6)<60&&c.y>py1-30&&c.y<py2+20){
      c.got=true;G.coffees++;G.bonus+=10;G.anger=Math.max(0,G.anger-6);G.pop=20;sCoffee();
      if(G.coffees%3===0)say('cof');
    }
  }
  G.cof=G.cof.filter(c=>c.x>-60&&!c.got);

  for(const s of G.spots){
    s.x-=sp;
    if(!s.done&&!s.missed&&PX>s.x+s.w){s.missed=true;G.anger=Math.min(100,G.anger+20);G.shake=14;say('miss');sHit();}
  }
  G.spots=G.spots.filter(s=>s.x>-500);

  if(G.pol){G.pol.t++;if(G.pol.t>150)G.pol=null}
  for(const b of G.bubbles)b.t--;
  G.bubbles=G.bubbles.filter(b=>b.t>0);
  if(--G.nextTalk<=0){G.nextTalk=rand(420,720);if(!G.bubbles.length)say('idle')}

  G.score=Math.floor(G.dist/40)+G.bonus;
  if(G.anger>=100){
    state='over';G.overT=0;sOver();
    if(G.score>best){best=G.score;try{localStorage.setItem('vn_best',best)}catch(e){}}
  }
}

// ---------- drawing helpers ----------
function terrain(base,amp,wl,off,color,terrace){
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=8){
    const t=x+off;
    const y=base+Math.sin(t/wl)*amp+Math.sin(t/(wl*.37)+1.7)*amp*.35;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill();
  if(terrace){
    ctx.save();ctx.clip();
    ctx.strokeStyle=terrace;ctx.lineWidth=2;
    for(let k=1;k<7;k++){
      ctx.beginPath();
      for(let x=0;x<=W;x+=8){
        const t=x+off;
        const y=base+k*13+Math.sin(t/wl)*amp+Math.sin(t/(wl*.37)+1.7)*amp*.35;
        x?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}
function cloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(x,y,22*s,0,7);ctx.arc(x+26*s,y-10*s,28*s,0,7);ctx.arc(x+56*s,y,24*s,0,7);ctx.arc(x+28*s,y+8*s,24*s,0,7);
  ctx.fill();
}
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#4aa3e8');g.addColorStop(.55,'#a6d8f5');g.addColorStop(1,'#e6f5ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const d=G.dist;
  for(let i=0;i<5;i++){const x=((i*260-d*.08)%1300+1300)%1300-200;cloud(x,70+(i*37%90),1+(i%3)*.25)}
  terrain(250,30,170,d*.12,'#6f9fb5');
  terrain(300,26,130,d*.25,'#5c9a5c','rgba(255,255,255,.12)');
  terrain(350,22,90,d*.5,'#3f8a3c','rgba(210,235,120,.28)');
  // roadside grass
  ctx.fillStyle='#2f7a2f';ctx.fillRect(0,GY-32,W,22);
  // road
  ctx.fillStyle='#4b4b52';ctx.fillRect(0,GY-12,W,H-GY+12);
  ctx.fillStyle='#d9d9df';ctx.fillRect(0,GY-12,W,4);
  ctx.fillStyle='#f4d35e';
  const off=-(d%90);
  for(let x=off;x<W;x+=90)ctx.fillRect(x,GY+38,50,6);
}

function head(img,key,cx,cy,r,opt={}){
  const [sx,sy,sw,sh]=SRC[key];
  ctx.save();ctx.translate(cx,cy);ctx.rotate(opt.rot||0);
  const sc=opt.scale||1;ctx.scale(sc,sc);
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r+4,0,7);ctx.fill();
  ctx.shadowColor='transparent';
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
  if(loaded>=2)ctx.drawImage(img,sx,sy,sw,sh,-r,-r,2*r,2*r);else{ctx.fillStyle='#ccc';ctx.fillRect(-r,-r,2*r,2*r)}
  if(opt.anger>0){
    ctx.fillStyle=`rgba(255,40,20,${Math.min(.45,opt.anger/100*.5)})`;ctx.fillRect(-r,-r,2*r,2*r);
  }
  ctx.restore();
  if(opt.brows){
    ctx.strokeStyle='#2a140a';ctx.lineWidth=5;ctx.lineCap='round';
    for(const m of[-1,1]){
      ctx.beginPath();ctx.moveTo(m*.52*r,-.5*r);ctx.lineTo(m*.12*r,-.28*r);ctx.stroke();
    }
  }
  ctx.restore();
}

function emoji(e,x,y,s){ctx.font=`${s}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(e,x,y)}

function drawBike(x,y){
  // wheels
  for(const wx of[x-52,x+54]){
    ctx.save();ctx.translate(wx,y-22);
    ctx.fillStyle='#1c1c1f';ctx.beginPath();ctx.arc(0,0,23,0,7);ctx.fill();
    ctx.fillStyle='#b9bcc4';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
    ctx.rotate(G.wheel*.12);ctx.strokeStyle='#555';ctx.lineWidth=3;
    for(let i=0;i<4;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.stroke()}
    ctx.restore();
  }
  // body
  ctx.fillStyle='#d8352f';
  ctx.beginPath();ctx.moveTo(x-62,y-46);ctx.quadraticCurveTo(x-60,y-30,x-30,y-30);ctx.lineTo(x+30,y-30);ctx.lineTo(x+48,y-68);ctx.lineTo(x+64,y-66);ctx.lineTo(x+50,y-22);ctx.lineTo(x-20,y-22);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2b2b2f';ctx.fillRect(x-52,y-54,66,10);
  ctx.strokeStyle='#333';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+48,y-66);ctx.lineTo(x+44,y-86);ctx.lineTo(x+66,y-88);ctx.stroke();
  ctx.fillStyle='#ffe87a';ctx.beginPath();ctx.arc(x+68,y-72,7,0,7);ctx.fill();
}

function drawRiders(x,y){
  const bob=Math.sin(G.t*.25)*(G.onGround?2.5:0);
  const popS=1+(G.pop>0?Math.sin(G.pop/40*Math.PI)*.25:0);
  const ang=G.anger;
  // --- she (behind) ---
  ctx.lineCap='round';
  // legs
  ctx.strokeStyle='#7a2f3d';ctx.lineWidth=14;
  ctx.beginPath();ctx.moveTo(x-30,y-62);ctx.lineTo(x-6,y-44);ctx.lineTo(x-14,y-14);ctx.stroke();
  // torso
  ctx.fillStyle='#f1c4d6';
  ctx.beginPath();ctx.roundRect(x-52,y-124+bob,34,64,12);ctx.fill();
  // arm with phone (up/back, selfie)
  ctx.strokeStyle='#e8b59a';ctx.lineWidth=9;
  const shake=ang>50?Math.sin(G.t*.8)*3:0;
  ctx.beginPath();ctx.moveTo(x-40,y-108+bob);ctx.lineTo(x-70,y-132+bob);ctx.lineTo(x-84+shake,y-158+bob);ctx.stroke();
  ctx.save();ctx.translate(x-84+shake,y-166+bob);ctx.rotate(-.25);
  ctx.fillStyle='#8f949d';ctx.beginPath();ctx.roundRect(-9,-15,18,30,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(-5,-11,4,4);ctx.fillRect(1,-3,3,3);ctx.fillRect(-4,5,3,3);
  ctx.restore();
  head(imgShe,'she',x-38,y-158+bob,35,{scale:popS,anger:ang,brows:ang>45,rot:Math.sin(G.t*.2)*.04});

  // --- he (front) ---
  const hb=Math.sin(G.t*.25+1)*(G.onGround?2:0);
  // legs with knee guards
  ctx.strokeStyle='#26262c';ctx.lineWidth=17;
  ctx.beginPath();ctx.moveTo(x+14,y-62);ctx.lineTo(x+46,y-50);ctx.lineTo(x+42,y-14);ctx.stroke();
  ctx.fillStyle='#b8bcc6';ctx.strokeStyle='#6a6e78';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x+48,y-50,13,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(x+34,y-40,14,22,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+46,y-8,14,6,0,0,7);ctx.fill();
  // torso
  ctx.fillStyle='#cfd9e0';
  ctx.beginPath();ctx.roundRect(x-6,y-128+hb,44,70,14);ctx.fill();
  // arm to handlebar
  ctx.strokeStyle='#e0a98c';ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(x+30,y-112+hb);ctx.lineTo(x+50,y-92);ctx.lineTo(x+62,y-87);ctx.stroke();
  head(imgHe,'he',x+22,y-166+hb,40,{scale:popS,rot:Math.sin(G.t*.2+2)*.04});
  // effects
  if(ang>60){emoji('💢',x-18,y-212+bob,28)}
  if(G.hitFlash>0)emoji('💧',x+60,y-190,24);
}

function bubble(who,text,t){
  const x=PX+(who==='she'?-52:28), ytop=GY+G.y-230;
  ctx.font='700 19px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(text).width+28,h=34;
  const a=Math.min(1,t/15);
  ctx.globalAlpha=a;
  let bx=Math.min(W-w/2-8,Math.max(w/2+8,x));
  ctx.fillStyle='#fff';ctx.strokeStyle='#222';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.roundRect(bx-w/2,ytop-h,w,h,14);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-6,ytop-1);ctx.lineTo(x+4,ytop+12);ctx.lineTo(x+8,ytop-1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x-4,ytop-3,10,4);
  ctx.fillStyle='#222';ctx.fillText(text,bx,ytop-h/2+1);
  ctx.globalAlpha=1;
}

function drawObs(o){
  const d=OB[o.type];
  if(o.type==='hole'){
    ctx.fillStyle='#232327';ctx.beginPath();ctx.ellipse(o.x+o.w/2,GY+2,o.w/2,9,0,0,7);ctx.fill();
    ctx.fillStyle='#3a3a40';ctx.beginPath();ctx.ellipse(o.x+o.w/2,GY,o.w/2-8,5,0,0,7);ctx.fill();
    return;
  }
  if(o.hit){ctx.globalAlpha=.4}
  emoji(d.e,o.x+o.w/2,GY+d.dy,d.s);
  ctx.globalAlpha=1;
}

function drawSpot(s){
  const x=s.x;
  // viewpoint platform & sign
  ctx.fillStyle='rgba(255,255,255,.18)';
  if(!s.done&&!s.missed&&PX>=s.x&&PX<=s.x+s.w){ctx.fillStyle='rgba(255,230,90,.35)'}
  ctx.fillRect(x,GY-14,s.w,10);
  ctx.fillStyle='#6b4a2b';ctx.fillRect(x+4,GY-120,8,110);
  ctx.fillStyle=s.done?'#2e8b57':s.missed?'#888':'#e0457b';
  ctx.beginPath();ctx.roundRect(x-34,GY-160,136,46,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 18px "Segoe UI",Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(s.done?'✔ צולם':'📸 נקודת צילום',x+34,GY-137);
}

function hud(){
  ctx.textBaseline='middle';
  // score (left)
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(14,12,190,50,12);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 26px "Segoe UI",Arial';ctx.textAlign='left';ctx.direction='ltr';
  ctx.fillText('⭐ '+G.score,28,37);
  ctx.font='600 14px "Segoe UI",Arial';ctx.fillStyle='#d6f2d6';ctx.fillText('☕ '+G.coffees+'   📸 '+G.selfies,118,37);
  ctx.direction='rtl';
  // anger bar (right)
  const bx=W-264,by=14,bw=250,bh=48;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",Arial';ctx.textAlign='right';
  ctx.fillText('😤 מד הכעס של אשתך',bx+bw-12,by+14);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.roundRect(bx+12,by+26,bw-24,12,6);ctx.fill();
  const a=G.anger/100;
  ctx.fillStyle=`hsl(${120-120*a},80%,50%)`;
  if(a>0){ctx.beginPath();ctx.roundRect(bx+12+(bw-24)*(1-a),by+26,(bw-24)*a,12,6);ctx.fill()}
}

function drawPolaroid(){
  const p=G.pol;if(!p)return;
  const k=Math.min(1,p.t/12), out=p.t>120?(150-p.t)/30:1;
  ctx.save();ctx.globalAlpha=Math.max(0,out);
  ctx.translate(W/2,H/2-20);ctx.rotate(-.06);const s=.3+.7*(1-Math.pow(1-k,3));ctx.scale(s,s);
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=24;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-150,-170,300,340,8);ctx.fill();
  ctx.shadowColor='transparent';
  const g=ctx.createLinearGradient(0,-150,0,70);g.addColorStop(0,'#4aa3e8');g.addColorStop(1,'#7dbb6b');
  ctx.fillStyle=g;ctx.fillRect(-132,-152,264,224);
  head(imgHe,'he',-48,-52,62);
  head(imgShe,'she',56,-40,56);
  ctx.fillStyle='#222';ctx.font='700 24px "Segoe UI",Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.cap,0,115);
  ctx.font='600 15px "Segoe UI",Arial';ctx.fillStyle='#777';ctx.fillText('תמונה #'+p.n+' +50',0,145);
  ctx.restore();
}

function activeSpot(){return G.spots.find(s=>!s.done&&!s.missed&&PX>=s.x&&PX<=s.x+s.w)}

function drawPlay(){
  ctx.save();
  if(G.shake>0)ctx.translate(rand(-5,5),rand(-4,4));
  bg();
  for(const s of G.spots)drawSpot(s);
  for(const o of G.obs)drawObs(o);
  for(const c of G.cof){emoji('☕',c.x,c.y+14,34)}
  // bike & riders (blink when invincible)
  const by=GY+G.y;
  if(!(G.inv>0&&Math.floor(G.inv/5)%2)){
    // shadow
    ctx.fillStyle='rgba(0,0,0,.25)';const sh=Math.max(.4,1+G.y/300);
    ctx.beginPath();ctx.ellipse(PX,GY+4,70*sh,8*sh,0,0,7);ctx.fill();
    ctx.save();ctx.translate(0,G.onGround?0:0);
    drawBike(PX,by);drawRiders(PX,by);ctx.restore();
  }
  for(const b of G.bubbles)bubble(b.who,b.text,b.t);
  ctx.restore();
  hud();
  const sp=activeSpot();
  if(sp){
    ctx.fillStyle='rgba(224,69,123,.92)';ctx.beginPath();ctx.roundRect(W/2-170,90,340,48,24);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='700 24px "Segoe UI",Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('!!📸 סלפי עכשיו (S)',W/2,115);
  }
  if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${G.flash})`;ctx.fillRect(0,0,W,H)}
  drawPolaroid();
}

function panel(){
  ctx.fillStyle='rgba(10,30,20,.62)';ctx.fillRect(0,0,W,H);
}

function drawStart(){
  bg();
  drawBike(PX+260,GY+0);G.pop=0;
  panel();
  ctx.textAlign='center';ctx.textBaseline='middle';
  head(imgHe,'he',W/2+110,170,80,{rot:.06});
  head(imgShe,'she',W/2-110,176,74,{rot:-.06});
  ctx.fillStyle='#fff';ctx.font='900 58px "Segoe UI",Arial';
  ctx.strokeStyle='#0d3a1f';ctx.lineWidth=8;ctx.lineJoin='round';
  ctx.strokeText('אופנוע בוייטנאם',W/2,300);ctx.fillText('אופנוע בוייטנאם',W/2,300);
  ctx.font='600 22px "Segoe UI",Arial';ctx.fillStyle='#e9fbe9';
  ctx.fillText('קפצו מעל תרנגולות, תאו מים וטוק-טוקים. אספו קפה ☕',W/2,350);
  ctx.fillText('ובנקודות צילום 📸 לחצו סלפי לפני שהיא מתעצבנת!',W/2,382);
  ctx.font='600 17px "Segoe UI",Arial';ctx.fillStyle='#bfe8c0';
  ctx.fillText('רווח / ↑ / נגיעה = קפיצה     S = סלפי',W/2,420);
  const pulse=1+Math.sin(G.t*.1)*.04;
  ctx.save();ctx.translate(W/2,475);ctx.scale(pulse,pulse);
  ctx.fillStyle='#ffcf3f';ctx.beginPath();ctx.roundRect(-110,-26,220,52,26);ctx.fill();
  ctx.fillStyle='#3a2a00';ctx.font='800 26px "Segoe UI",Arial';ctx.fillText('!יאללה, ניסע',0,2);
  ctx.restore();
}

function drawOver(){
  drawPlay();
  panel();
  ctx.textAlign='center';ctx.textBaseline='middle';
  head(imgShe,'she',W/2,150,78,{anger:100,brows:true,rot:Math.sin(G.t*.3)*.08});
  emoji('💢',W/2+80,100,50);emoji('💢',W/2-90,110,40);
  ctx.fillStyle='#fff';ctx.strokeStyle='#4a0d0d';ctx.lineWidth=8;ctx.lineJoin='round';
  ctx.font='900 50px "Segoe UI",Arial';
  ctx.strokeText('!היא ירדה מהאופנוע',W/2,270);ctx.fillText('!היא ירדה מהאופנוע',W/2,270);
  ctx.font='700 26px "Segoe UI",Arial';
  ctx.fillText(`ניקוד: ${G.score}     שיא: ${best}`,W/2,322);
  ctx.font='600 20px "Segoe UI",Arial';ctx.fillStyle='#ffd9d9';
  ctx.fillText(`${G.selfies} סלפיז   ·   ${G.coffees} קפה`,W/2,358);
  if(G.overT>40){
    ctx.fillStyle='#ffcf3f';ctx.beginPath();ctx.roundRect(W/2-120,400,240,52,26);ctx.fill();
    ctx.fillStyle='#3a2a00';ctx.font='800 26px "Segoe UI",Arial';ctx.fillText('!עוד סיבוב, ותתנצל',W/2,427);
  }
}

// ---------- loop ----------
function frame(ts){
  if(!last)last=ts;
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=1000/60){step();acc-=1000/60}
  if(state==='start')drawStart();else if(state==='over')drawOver();else drawPlay();
  document.body.classList.toggle('p',state==='play');
  bj.style.display=bs.style.display=(state==='play')?'':'none';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
